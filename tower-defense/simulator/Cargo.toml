[package]
name = "td-simulator"
version = "0.1.0"
edition = "2024"

[features]
default = ["simulator"]
simulator = []
simulator-wgpu = ["simulator", "dep:burn-wgpu"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3"
indicatif = "0.17"
libc = "0.2"
ratatui = "0.29"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = { version = "0.8.5", features = ["alloc"] }
rand_chacha = "=0.3.1"
burn = { version = "0.21.0", default-features = false, features = ["std"] }
burn-autodiff = "0.21.0"
burn-flex = "0.21.0"
burn-wgpu = { version = "0.21.0", default-features = false, features = ["std", "fusion", "webgpu"], optional = true }
td-core = { path = "../core" }

[dev-dependencies]
td-core = { path = "../core" }

[patch.crates-io]
rayon = { git = "https://github.com/NamseEnt/rayon", branch = "v1.11.0-fork" }
rayon-core = { git = "https://github.com/NamseEnt/rayon", branch = "v1.11.0-fork" }
