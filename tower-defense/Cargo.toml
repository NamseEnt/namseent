[package]
name = "tower-defense"
version = "0.1.0"
edition = "2024"

[package.metadata.namui]
targets = ["wasm32-wasi-web", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
icon = "asset/image/tower/high/idle1.png"

[features]
default = []
debug-tools = []
simulator = ["dep:rusqlite", "dep:clap", "dep:rayon", "dep:indicatif", "dep:ctrlc", "dep:crossterm", "dep:ratatui", "dep:namui-kv-store-memory", "dep:burn", "dep:burn-autodiff", "dep:burn-flex", "dep:libc"]
simulator-wgpu = ["simulator", "dep:burn-wgpu"]

[dependencies]
anyhow = "1.0.98"
libc = { version = "0.2", optional = true }
namui = { path = "../namui/namui" }
namui-prebuilt = { path = "../namui/namui-prebuilt" }
rand = { version = "0.8.5", features = ["alloc"] }
rand_chacha = "=0.3.1"

rusqlite = { version = "0.31", features = ["bundled"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.7"
indicatif = { version = "0.17", optional = true }
ctrlc = { version = "3", optional = true }
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }
namui-kv-store-memory = { path = "test_support/namui-kv-store-memory", optional = true }
burn = { version = "0.21.0", default-features = false, features = ["std"], optional = true }
burn-autodiff = { version = "0.21.0", optional = true }
burn-flex = { version = "0.21.0", optional = true }
burn-wgpu = { version = "0.21.0", default-features = false, features = ["std", "fusion", "webgpu"], optional = true }
strum = "0.28.0"
strum_macros = "0.28.0"
enum_dispatch = "0.3"

[[bin]]
name = "td-simulator"
path = "src/bin/td_simulator.rs"
required-features = ["simulator"]

[[bin]]
name = "td-stats"
path = "src/bin/td_stats.rs"
required-features = ["simulator"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
namui-kv-store-memory = { path = "test_support/namui-kv-store-memory" }

[[bench]]
name = "rich_text_benchmark"
harness = false

[patch.crates-io]
rayon = { git = "https://github.com/NamseEnt/rayon", branch = "v1.11.0-fork" }
rayon-core = { git = "https://github.com/NamseEnt/rayon", branch = "v1.11.0-fork" }
