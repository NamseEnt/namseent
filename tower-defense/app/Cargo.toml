[package]
name = "tower-defense"
version = "0.1.0"
edition = "2024"

[package.metadata.namui]
targets = ["wasm32-wasi-web", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
icon = "asset/image/tower/high/idle1.png"

[features]
default = []
debug-tools = []

[dependencies]
anyhow = "1.0.98"
td-core = { path = "../core" }
namui = { path = "../../namui/namui" }
namui-prebuilt = { path = "../../namui/namui-prebuilt" }
rand = { version = "0.8.5", features = ["alloc"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.7"
strum = "0.28.0"
strum_macros = "0.28.0"
enum_dispatch = "0.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
namui-kv-store-memory = { path = "../test_support/namui-kv-store-memory" }

[[bench]]
name = "rich_text_benchmark"
harness = false
